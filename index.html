  <meta name="description"
    content="Energy Feeds Weighbridge Management System - Professional vehicle weighing, tracking, and payment processing for SudSud Group" />

  <meta property="og:title" content="Energy Feeds Weighbridge System" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root">
    <!-- Loading spinner shown while app loads -->
    <style>
      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        z-index: 9999;
      }

      .app-loader-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .app-loader-text {
        margin-top: 20px;
        color: #94a3b8;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="app-loader">
      <div class="app-loader-spinner"></div>
      <div class="app-loader-text">Loading Weighbridge System...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
